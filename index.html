<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #111827;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #263244;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
    }

    .ai {
      margin-right: auto;
      background: #1f2937;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111827;
      border-top: 1px solid #263244;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 25px;
      background: #273244;
      color: white;
      font-size: 16px;
    }

    button {
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-size: 20px;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <header>🤖 MR AI Assistant</header>

  <div id="chat">
    <div class="message ai">
      Namaste! 👋 Main MR AI Assistant hoon.
      Mujhse kuch bhi poochho.
    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="Message likho..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button onclick="sendMessage()">➤</button>
  </div>

  <script>
    const API_URL =
      "https://mr-ai-assistant.mohitkumar92470.workers.dev/api/chat";

    let messages = [];

    async function sendMessage() {
      const input = document.getElementById("message");
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      messages.push({
        role: "user",
        content: text
      });

      const aiBox = addMessage("Thinking... 🤔", "ai");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: messages
          })
        });

        if (!response.ok) {
          throw new Error("Server error: " + response.status);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let buffer = "";
        let fullReply = "";

        while (true) {
          const { value, done } = await reader.read();

          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            const lines = part.split("\n");

            for (const line of lines) {
              if (!line.startsWith("data:")) continue;

              const data = line.slice(5).trim();

              if (!data || data === "[DONE]") continue;

              try {
                const json = JSON.parse(data);

                const textChunk =
                  json.response ||
                  json.content ||
                  json.text ||
                  json.delta ||
                  "";

                if (textChunk) {
                  fullReply += textChunk;
                  aiBox.textContent = fullReply;
                  scrollChat();
                }
              } catch (e) {
                // Ignore incomplete stream data
              }
            }
          }
        }

        if (!fullReply) {
          aiBox.textContent =
            "AI se response nahi mila. Dobara try karo.";
        }

        messages.push({
          role: "assistant",
          content: fullReply
        });

      } catch (error) {
        console.error(error);

        aiBox.textContent =
          "❌ AI connect nahi ho pa raha. Thodi der baad dobara try karo.";
      }
    }

    function addMessage(text, type) {
      const chat = document.getElementById("chat");

      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;

      chat.appendChild(div);
      scrollChat();

      return div;
    }

    function scrollChat() {
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
