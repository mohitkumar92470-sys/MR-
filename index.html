<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #111827;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #263244;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
    }

    .ai {
      margin-right: auto;
      background: #1f2937;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111827;
      border-top: 1px solid #263244;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 25px;
      background: #273244;
      color: white;
      font-size: 16px;
    }

    button {
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-size: 20px;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <header>🤖 MR AI Assistant</header>

  <div id="chat">
    <div class="message ai">
      Namaste! 👋 Main MR AI Assistant hoon.
      Mujhse kuch bhi poochho.
    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="Message likho..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button onclick="sendMessage()">➤</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      setTimeout(() => {
        let reply = getReply(text);
        addMessage(reply, "ai");
      }, 500);
    }

    function addMessage(text, type) {
      const chat = document.getElementById("chat");

      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function getReply(text) {
      const msg = text.toLowerCase();

      if (msg.includes("hello") || msg.includes("hi") || msg.includes("namaste")) {
        return "Namaste! 😊 Kaise ho? Main aapki help karne ke liye ready hoon.";
      }

      if (msg.includes("naam")) {
        return "Mera naam MR AI Assistant hai 🤖";
      }

      if (msg.includes("kaise ho")) {
        return "Main bilkul ready hoon 😎 Aap batao kya karna hai?";
      }

      if (msg.includes("thank")) {
        return "You're welcome! ❤️";
      }

      return "Aapne kaha: " + text +
        "\\n\\nMain abhi basic mode mein hoon. Agle step mein hum isme real AI connect karenge. 🚀";
    }
  </script>

</body>
</html>
