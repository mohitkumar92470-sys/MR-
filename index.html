<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR AI Assistant</title>
  
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #111827;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #263244;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
    }

    .ai {
      margin-right: auto;
      background: #1f2937;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111827;
      border-top: 1px solid #263244;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 25px;
      background: #273244;
      color: white;
      font-size: 16px;
      min-width: 0;
    }

    button {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-size: 20px;
    }

    #micButton {
      background: #16a34a;
    }

    #micButton.listening {
      background: #dc2626;
      animation: pulse 1s infinite;
    }

    button:active {
      transform: scale(0.95);
    }

    @keyframes pulse {
      50% {
        transform: scale(1.1);
      }
    }

    .speak-button {
      display: block;
      width: auto;
      height: auto;
      padding: 5px 10px;
      margin-top: 8px;
      border-radius: 15px;
      background: #374151;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>🤖 MR AI Assistant</header>

  <div id="chat">
    <div class="message ai">
      Namaste! 👋 Main MR AI Assistant hoon.
      Mujhse kuch bhi poochho.
    </div>
  </div>

  <div class="input-area">

    <button id="micButton" onclick="startVoice()">
      🎤
    </button>

    <input
      id="message"
      type="text"
      placeholder="Message likho ya 🎤 dabao..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button onclick="sendMessage()">
      ➤
    </button>

  </div>

  <script>
    const API_URL =
      "https://mr-ai-assistant.mohitkumar92470.workers.dev/api/chat";

    let messages = [];

    // =========================
    // VOICE INPUT 🎤
    // =========================

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();

      recognition.lang = "hi-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function () {
        document.getElementById("micButton")
          .classList.add("listening");

        document.getElementById("message").placeholder =
          "🎤 Sun raha hoon...";
      };

      recognition.onresult = function (event) {
        const text = event.results[0][0].transcript;

        document.getElementById("message").value = text;

        sendMessage();
      };

      recognition.onerror = function () {
        alert("🎤 Mic se awaaz nahi mil paayi. Dobara try karo.");
      };

      recognition.onend = function () {
        document.getElementById("micButton")
          .classList.remove("listening");

        document.getElementById("message").placeholder =
          "Message likho ya 🎤 dabao...";
      };
    }

    function startVoice() {
      if (!recognition) {
        alert("Is browser mein voice input supported nahi hai.");
        return;
      }

      recognition.start();
    }

    // =========================
    // SEND MESSAGE
    // =========================

    async function sendMessage() {
      const input = document.getElementById("message");
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      messages.push({
        role: "user",
        content: text
      });

      const aiBox = addMessage("Thinking... 🤔", "ai");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: messages
          })
        });

        if (!response.ok) {
          throw new Error("Server error: " + response.status);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let buffer = "";
        let fullReply = "";

        while (true) {
          const { value, done } = await reader.read();

          if (done) break;

          buffer += decoder.decode(value, {
            stream: true
          });

          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            const lines = part.split("\n");

            for (const line of lines) {
              if (!line.startsWith("data:")) continue;

              const data = line.slice(5).trim();

              if (!data || data === "[DONE]") continue;

              try {
                const json = JSON.parse(data);

                const textChunk =
                  json.response ||
                  json.content ||
                  json.text ||
                  json.delta ||
                  "";

                if (textChunk) {
                  fullReply += textChunk;
                  aiBox.firstChild.textContent = fullReply;
                  scrollChat();
                }

              } catch (e) {
                // Ignore incomplete stream data
              }
            }
          }
        }

        if (!fullReply) {
          fullReply =
            "AI se response nahi mila. Dobara try karo.";

          aiBox.firstChild.textContent = fullReply;
        }

        messages.push({
          role: "assistant",
          content: fullReply
        });

        // AI जवाब को आवाज़ में बोलना 🔊
        speakText(fullReply);

      } catch (error) {
        console.error(error);

        aiBox.firstChild.textContent =
          "❌ AI connect nahi ho pa raha. Thodi der baad dobara try karo.";
      }
    }

    // =========================
    // ADD MESSAGE
    // =========================

    function addMessage(text, type) {
      const chat = document.getElementById("chat");

      const wrapper = document.createElement("div");
      wrapper.className = "message " + type;

      const textDiv = document.createElement("div");
      textDiv.textContent = text;

      wrapper.appendChild(textDiv);

      // AI message ke saath speaker button 🔊
      if (type === "ai") {
        const speakButton = document.createElement("button");

        speakButton.className = "speak-button";
        speakButton.textContent = "🔊 सुनें";

        speakButton.onclick = function () {
          speakText(textDiv.textContent);
        };

        wrapper.appendChild(speakButton);
      }

      chat.appendChild(wrapper);
      scrollChat();

      return wrapper;
    }

    // =========================
    // TEXT TO SPEECH 🔊
    // =========================

    function speakText(text) {
      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(text);

      // Hindi / Bhojpuri ke liye Hindi voice
      speech.lang = "hi-IN";
      speech.rate = 0.9;
      speech.pitch = 1;

      window.speechSynthesis.speak(speech);
    }

    // =========================
    // SCROLL
    // =========================

    function scrollChat() {
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
